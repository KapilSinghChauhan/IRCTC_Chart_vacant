name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: pytest
      - name: Secret scan
        run: |
          set -euo pipefail
          if git grep -nE 'limpopo|Limpopo|LIMPOPO' -- ':!.github/workflows/ci.yml'; then
            echo "Forbidden project reference found" >&2
            exit 1
          fi
          if git grep -nE 'AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|xox[baprs]-' -- .; then
            echo "Possible secret found" >&2
            exit 1
          fi
